name: Check and build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: npm run guide:check -- --allow-draft
      - id: guide
        shell: pwsh
        run: |
          $guide = Get-Content docs/user-guide/manifest.json | ConvertFrom-Json
          "ready=$($guide.status -eq 'final')" >> $env:GITHUB_OUTPUT
          if ($guide.status -ne 'final') { Write-Output 'Draft guide: checks passed; release artifacts remain disabled until the full guide is reviewed.' }
      - if: steps.guide.outputs.ready == 'True'
        run: npm run build:windows
      - uses: actions/upload-artifact@v4
        if: steps.guide.outputs.ready == 'True'
        with:
          name: Tablelight-Windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error
          retention-days: 14
