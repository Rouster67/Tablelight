<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Tablelight · Test map</title>
    <style>
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        place-items: center;
        color: #d7dfca;
        background-color: #20322d;
        background-image:
          linear-gradient(#8db09b33 1px, transparent 1px),
          linear-gradient(90deg, #8db09b33 1px, transparent 1px);
        background-size: 64px 64px;
        font:
          22px 'Segoe UI',
          sans-serif;
      }
      button {
        padding: 30px 50px;
        background: #30483c;
        color: #f3e0af;
        border: 2px solid #b5a277;
        border-radius: 16px;
        font: inherit;
      }
      .caption {
        position: absolute;
        bottom: 80px;
        left: 0;
        right: 0;
        text-align: center;
        color: #a9b5a9;
      }
    </style>
  </head>
  <body>
    <button id="map-button">Map test: 0 clicks</button>
    <div class="caption">
      Temporary map for checking that clicks pass between the character bubbles.
    </div>
    <script src="map-fixture.js"></script>
  </body>
</html>
